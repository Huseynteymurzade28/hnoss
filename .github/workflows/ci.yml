name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ODIN_RELEASE: dev-2026-10 # the one place the compiler version is pinned

jobs:
  build:
    strategy:
      fail-fast: false # a macOS failure shouldn't cancel the Linux run, and vice versa
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest is Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - run: odin version
      - run: ./build.sh # check + tests + all examples

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the first run also installs LLVM and builds Odin from source
    steps:
      - uses: actions/checkout@v4
      # GitHub has no native FreeBSD runner, so run the whole script in a VM.
      # The odin-lang package is not a reliable pin: it follows the ports tree,
      # and because ports builds from a tarball without .git, its version
      # string comes from the build month rather than the release tag. Build
      # ODIN_RELEASE from a git checkout instead, mirroring lang/odin: LLVM 21
      # + gmake, target "release" (not "release-native", which is
      # -march=native). Building in prepare lets the VM image be cached.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15" # newest 15.x
          copyback: false
          cache-after-prepare: true
          cache-after-prepare-key-suffix: odin-${{ env.ODIN_RELEASE }}
          prepare: |
            set -eu
            pkg install -y bash git gmake llvm21 ca_root_nss
            rm -rf "$HOME/odin"
            git clone --depth 1 --branch "${{ env.ODIN_RELEASE }}" \
              https://github.com/odin-lang/Odin "$HOME/odin"
            cd "$HOME/odin"
            gmake release
            ./odin version
          run: |
            set -eu
            test -x "$HOME/odin/odin"
            # "odin version" echoes argv[0], so keep only the version token.
            # A git build appends the commit: dev-2026-10:84bc3fc.
            raw="$("$HOME/odin/odin" version)"
            version="${raw##* }"
            case "$version" in
              "${{ env.ODIN_RELEASE }}"|"${{ env.ODIN_RELEASE }}:"*) ;;
              *) echo "unexpected Odin version: $version" >&2; exit 1 ;;
            esac
            uname -a
            echo "odin version $version"
            ODIN="$HOME/odin/odin" bash ./build.sh # check + tests + all examples

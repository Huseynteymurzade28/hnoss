name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ODIN_RELEASE: dev-2026-10 # the one place the compiler version is pinned

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - run: odin version
      - run: ./build.sh # check + tests + all examples

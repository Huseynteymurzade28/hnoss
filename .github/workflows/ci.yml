name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ODIN_RELEASE: dev-2026-10 # Linux/macOS: the one place the compiler version is pinned

jobs:
  build:
    strategy:
      fail-fast: false # a macOS failure shouldn't cancel the Linux run, and vice versa
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest is Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}
      - run: odin version
      - run: ./build.sh # check + tests + all examples

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # GitHub has no native FreeBSD runner, so run the whole script in a VM.
      # The compiler comes from FreeBSD's lang/odin package, which tracks the
      # latest monthly release rather than ODIN_RELEASE.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15" # newest 15.x
          copyback: false
          prepare: |
            pkg install -y bash odin-lang
          run: |
            uname -a
            pkg info odin-lang
            odin version
            bash ./build.sh # check + tests + all examples
